server:
  port: ${SERVER_PORT:10001}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/v2/huertos}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:huertos-service}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://mariadb:3306/huertos}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null
    time-zone: Europe/Madrid

jwt:
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:/home/jomaa/.config/backend/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:/home/jomaa/.config/backend/public.pem}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

filesDir: ${FILES_DIR:/files}

core:
  url: ${CORE_URL:http://core:10000/v2/core}

huertos:
  user: ${HUERTOS_USER}
  password: ${HUERTOS_PASS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
